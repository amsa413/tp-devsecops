
name: CI-CD democyber

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Scanner les secrets avec Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Installer Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compiler et tester
        run: mvn clean package

      - name: Analyser le code avec SonarCloud
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_ORGANIZATION: ${{ secrets.SONAR_ORGANIZATION }}
          SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
        run: |
          mvn -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.organization="$SONAR_ORGANIZATION" \
            -Dsonar.projectKey="$SONAR_PROJECT_KEY"


      - name: Construire image Docker
        run: docker build -t democyber:latest .

      - name: Tester image Docker localement
        run: |
          docker run -d --name democyber-test -p 8080:8080 democyber:latest
          for i in {1..30}; do
            if curl --fail --silent http://localhost:8080; then
              echo "Application Docker fonctionnelle"
              exit 0
            fi
            sleep 2
          done

          echo "Erreur : application non accessible"
          docker logs democyber-test
          exit 1

      - name: Nettoyer le conteneur de test
        if: always()
        run: docker rm -f democyber-test || true

      - name: Scanner image Docker avec Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'democyber:latest'
          format: 'table'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'


      - name: Generer rapport Trivy
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'democyber:latest'
          format: 'json'
          output: 'trivy-report.json'
          severity: 'HIGH,CRITICAL'
          exit-code: '0'

      - name: Sauvegarder rapport Trivy
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-security-report
          path: trivy-report.json
          if-no-files-found: warn


      - name: Connexion Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publier image Docker
        if: github.event_name == 'push'
        run: |
          docker tag democyber:latest ${{ secrets.DOCKERHUB_USERNAME }}/democyber:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/democyber:latest
