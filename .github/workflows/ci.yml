
name: CI-CD democyber

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Scanner les secrets avec Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Installer Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compiler et tester
        run: mvn clean package

      - name: Construire image Docker
        run: docker build -t democyber:latest .

      - name: Connexion Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publier image Docker
        if: github.event_name == 'push'
        run: |
          docker tag democyber:latest ${{ secrets.DOCKERHUB_USERNAME }}/democyber:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/democyber:latest
